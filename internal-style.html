<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phần 2 - Internal style</title>

    <!-- Internal style: viết CSS trong thẻ <style> ở phần <head> -->
    <style>
      h1 {
        color: #1565c0;
      }

      p {
        color: #455a64;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Internal style</h1>
      <p>
        Màu chữ của tiêu đề và đoạn văn này được đặt bằng thẻ
        <code>&lt;style&gt;</code> nằm trong phần <code>&lt;head&gt;</code> của
        trang.
      </p>
    </main>
  </body>
</html>
