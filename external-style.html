<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phần 3 - External style</title>

    <!-- External style: liên kết tới tệp CSS riêng -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>External style</h1>
      <p>
        Màu chữ của tiêu đề và đoạn văn này được đặt trong tệp
        <code>style.css</code> và liên kết vào trang bằng thẻ
        <code>&lt;link&gt;</code>.
      </p>
    </main>
  </body>
</html>
