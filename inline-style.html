<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phần 1 - Inline style</title>
  </head>
  <body>
    <main>
      <!-- Inline style: viết CSS trực tiếp trong thuộc tính style của thẻ -->
      <h1 style="color: #d32f2f">Inline style</h1>
      <p style="color: #455a64">
        Màu chữ của tiêu đề và đoạn văn này được đặt bằng thuộc tính
        <code>style</code> ngay trên từng thẻ HTML.
      </p>
    </main>
  </body>
</html>
